services:
  - type: web
    name: insurance-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask db upgrade && gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: insurance-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
      - key: UPLOAD_FOLDER
        value: uploads
      - key: REPORTS_FOLDER
        value: reports

databases:
  - name: insurance-db
    plan: free
